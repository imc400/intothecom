<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin · Intothecom</title>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#0a0a0b"/>

<link rel="icon" type="image/png" href="/assets/mark-dark.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f4efe6;
    color: #1a1a1d;
    font-family: 'Sora', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .admin-shell {
    display: flex;
    min-height: 100vh;
  }
  .admin-sidebar {
    width: 280px;
    background: #0a0a0b;
    color: #f4efe6;
    padding: 32px 24px;
    border-right: 1px solid #1a1a1d;
    overflow-y: auto;
  }
  .admin-main {
    flex: 1;
    padding: 32px 40px;
    overflow-y: auto;
    max-height: 100vh;
  }
  .admin-brand {
    font-family: 'Sora', sans-serif;
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .admin-brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: #f39200;
    margin-bottom: 32px;
    text-transform: uppercase;
  }
  .admin-user {
    border-top: 1px solid #1a1a1d;
    padding-top: 24px;
    margin-top: auto;
    font-size: 12px;
    color: rgba(244,239,230,0.7);
  }
  .admin-user-email {
    color: #f4efe6;
    margin-bottom: 8px;
    word-break: break-all;
  }
  .admin-nav { display: flex; flex-direction: column; gap: 4px; }
  .admin-nav-item {
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: rgba(244,239,230,0.7);
    background: transparent;
    border: none;
    text-align: left;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.15s;
  }
  .admin-nav-item:hover { background: rgba(244,239,230,0.05); color: #f4efe6; }
  .admin-nav-item.active { background: rgba(243,146,0,0.15); color: #f39200; }
  .btn {
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .btn-primary { background: #f39200; color: #0a0a0b; }
  .btn-primary:hover { background: #ff9d0a; }
  .btn-primary:disabled { background: #cccccc; color: #888; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: #f4efe6;
    border: 1px solid rgba(244,239,230,0.2);
  }
  .btn-ghost:hover { border-color: rgba(244,239,230,0.5); }
  .btn-danger { background: #d32f2f; color: white; }
  .btn-danger:hover { background: #e53935; }
  .login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 40px;
  }
  .login-card {
    background: white;
    padding: 48px 40px;
    border-radius: 12px;
    box-shadow: 0 10px 60px rgba(0,0,0,0.08);
    max-width: 420px;
    width: 100%;
  }
  .login-title {
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .login-subtitle {
    color: rgba(26,26,29,0.6);
    margin-bottom: 32px;
    font-size: 14px;
  }
  .btn-google {
    width: 100%;
    background: white;
    color: #1a1a1d;
    border: 1px solid rgba(26,26,29,0.15);
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .btn-google:hover { border-color: rgba(26,26,29,0.4); background: #fafafa; }
  .article-list { display: flex; flex-direction: column; gap: 12px; }
  .article-item {
    background: white;
    border: 1px solid rgba(26,26,29,0.08);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .article-item:hover { border-color: rgba(26,26,29,0.2); transform: translateY(-1px); }
  .article-item-title { font-size: 16px; font-weight: 500; }
  .article-item-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(26,26,29,0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }
  .h1 { font-size: 32px; font-weight: 500; }
  .h2-section { font-size: 18px; font-weight: 500; margin: 32px 0 16px 0; }
  .form-field { margin-bottom: 16px; }
  .form-field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(26,26,29,0.6);
    margin-bottom: 6px;
  }
  .form-field input, .form-field textarea, .form-field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid rgba(26,26,29,0.15);
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    background: white;
    color: #1a1a1d;
  }
  .form-field input:focus, .form-field textarea:focus, .form-field select:focus {
    outline: none;
    border-color: #f39200;
  }
  .form-field textarea { min-height: 80px; font-family: 'Sora', sans-serif; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .section-block {
    background: white;
    border: 1px solid rgba(26,26,29,0.1);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .section-block-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(26,26,29,0.6);
  }
  .add-section {
    background: #ededea;
    border: 2px dashed rgba(26,26,29,0.15);
    color: #1a1a1d;
    padding: 16px;
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    border-radius: 8px;
    color: white;
    font-size: 13px;
    z-index: 99999;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    max-width: 400px;
  }
  .toast.success { background: #2e7d32; }
  .toast.error { background: #c62828; }
  .toast.info { background: #1565c0; }
  .empty-state { text-align: center; padding: 60px 20px; color: rgba(26,26,29,0.5); }
  .row-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .row-buttons button {
    background: rgba(26,26,29,0.05);
    color: #1a1a1d;
    padding: 4px 10px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
  }
  .row-buttons button:hover { border-color: rgba(26,26,29,0.15); }
  .row-buttons button.danger { color: #c62828; }
  .pre-publish-check {
    background: rgba(243,146,0,0.08);
    border-left: 3px solid #f39200;
    padding: 12px 16px;
    margin: 16px 0;
    font-size: 13px;
    line-height: 1.6;
  }

  /* === Tooltip system === */
  .tooltip-wrap { position: relative; display: inline-block; margin-left: 6px; }
  .tooltip-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(26,26,29,0.1); color: rgba(26,26,29,0.6);
    font-size: 10px; font-weight: 600; cursor: help; user-select: none;
    font-family: 'JetBrains Mono', monospace;
  }
  .tooltip-icon:hover, .tooltip-icon:focus { background: #f39200; color: #fff; outline: none; }
  .tooltip-body {
    position: absolute; left: 24px; top: -4px;
    z-index: 100; min-width: 240px; max-width: 320px;
    padding: 10px 12px; border-radius: 6px;
    background: #1a1a1d; color: #f4efe6;
    font-size: 12px; line-height: 1.5; font-weight: 400;
    text-transform: none; letter-spacing: 0;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18);
    pointer-events: none;
  }

  /* === Field hints + counters === */
  .field-hint-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 12px; }
  .field-hint { font-size: 11px; color: rgba(26,26,29,0.5); font-family: 'JetBrains Mono', monospace; }
  .field-counter { font-size: 11px; font-family: 'JetBrains Mono', monospace; padding: 2px 6px; border-radius: 3px; }
  .field-counter.is-empty { background: rgba(0,0,0,0.05); color: rgba(0,0,0,0.4); }
  .field-counter.is-low { background: rgba(243,146,0,0.15); color: #c66800; }
  .field-counter.is-high { background: rgba(198,40,40,0.12); color: #c62828; }
  .field-counter.is-ok { background: rgba(46,125,50,0.12); color: #2e7d32; }

  /* === Collapsible === */
  .collapsible { background: white; border: 1px solid rgba(26,26,29,0.08); border-radius: 8px; margin-bottom: 16px; }
  .collapsible-head {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 16px 20px; background: rgba(26,26,29,0.02); border: none; cursor: pointer;
    border-radius: 8px 8px 0 0;
    font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 500; color: #1a1a1d;
    text-align: left;
  }
  .collapsible-head:hover { background: rgba(26,26,29,0.04); }
  .collapsible-chevron { font-size: 12px; color: rgba(26,26,29,0.5); width: 12px; }
  .collapsible-title { flex: 1; }
  .collapsible-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 2px 8px;
    border-radius: 3px; background: rgba(198,40,40,0.12); color: #c62828;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .collapsible-body { padding: 20px; border-top: 1px solid rgba(26,26,29,0.06); }

  /* === Editor shell (sidebar + main) === */
  .editor-shell { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: flex-start; }
  .editor-main { min-width: 0; }
  .header-row.sticky {
    position: sticky; top: 0; z-index: 50;
    background: #f4efe6; padding: 16px 0;
    margin: -16px 0 16px 0; border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  @media (max-width: 1100px) {
    .editor-shell { grid-template-columns: 1fr; }
  }

  /* === Quality Score Card === */
  .qs-card {
    position: sticky; top: 24px;
    background: white; border: 1px solid rgba(26,26,29,0.1); border-radius: 12px;
    padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  }
  .qs-score-circle {
    width: 110px; height: 110px; border-radius: 50%;
    border: 6px solid #f39200; margin: 0 auto 12px auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: white;
  }
  .qs-score-num { font-family: 'Sora', sans-serif; font-size: 36px; font-weight: 600; line-height: 1; }
  .qs-score-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(0,0,0,0.4); margin-top: 2px; }
  .qs-status { text-align: center; font-weight: 500; font-size: 14px; margin-bottom: 14px; }
  .qs-counts {
    background: rgba(26,26,29,0.03); border-radius: 6px; padding: 10px 12px;
    font-size: 12px; line-height: 1.7; margin-bottom: 16px;
  }
  .qs-counts strong { font-family: 'JetBrains Mono', monospace; color: #1a1a1d; }
  .qs-issues-title {
    font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;
    color: rgba(26,26,29,0.65); margin-bottom: 10px; line-height: 1.4;
  }
  .qs-issues-list { list-style: none; padding: 0; margin: 0; max-height: 360px; overflow-y: auto; }
  .qs-issue { display: flex; gap: 8px; padding: 8px 10px; border-radius: 4px; margin-bottom: 4px; font-size: 12px; line-height: 1.45; }
  .qs-issue-critical { background: rgba(198,40,40,0.07); }
  .qs-issue-warn { background: rgba(243,146,0,0.07); }
  .qs-issue-info { background: rgba(21,101,192,0.06); }
  .qs-issue-sev { flex-shrink: 0; }
  .qs-issue-msg { color: #1a1a1d; }
  .qs-all-good {
    text-align: center; padding: 16px; background: rgba(46,125,50,0.08);
    border-radius: 6px; color: #2e7d32; font-size: 13px; margin-bottom: 12px;
  }
  .qs-helper { margin-top: 16px; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 14px; }
  .qs-helper-toggle {
    width: 100%; background: transparent; border: none; cursor: pointer;
    padding: 6px 0; text-align: left; font-size: 12px; font-weight: 500;
    color: rgba(26,26,29,0.7);
  }
  .qs-helper-body { margin-top: 8px; max-height: 220px; overflow-y: auto; }
  .qs-helper-link {
    display: flex; gap: 6px; padding: 6px 8px; margin-bottom: 4px;
    background: rgba(26,26,29,0.03); border-radius: 4px;
    font-size: 10px; align-items: center;
  }
  .qs-helper-link code {
    flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: #1a1a1d; word-break: break-all;
  }
  .qs-copy-btn {
    background: #f39200; color: white; border: none; padding: 3px 8px;
    border-radius: 3px; font-size: 9px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .qs-copy-btn:hover { background: #ff9d0a; }
  .qs-legend {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.06);
    font-size: 11px; line-height: 1.6; color: rgba(26,26,29,0.55);
  }
  .qs-legend strong { color: #1a1a1d; }

  /* === Stats grid (dashboard list view) === */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: white; border: 1px solid rgba(0,0,0,0.06); border-radius: 8px; padding: 16px 18px;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; color: rgba(0,0,0,0.5); margin-bottom: 6px;
  }
  .stat-value { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 500; }
  @media (max-width: 800px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* === Article list quality badges === */
  .article-item-row { display: flex; gap: 16px; align-items: flex-start; }
  .article-quality-badge {
    flex-shrink: 0; width: 80px; padding: 10px 8px; border: 2px solid #f39200; border-radius: 8px;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .article-quality-score { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 600; line-height: 1; }
  .article-quality-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(0,0,0,0.4); }
  .article-quality-critical, .article-quality-warn, .article-quality-ok {
    font-size: 11px; margin-top: 4px;
  }

  /* === Admin divider === */
  .admin-divider {
    height: 1px; background: rgba(244,239,230,0.1); margin: 16px 0;
  }

  /* === SEO Dashboard === */
  .dashboard-health {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 16px; padding: 12px 14px;
    background: white; border-radius: 8px; border: 1px solid rgba(0,0,0,0.06);
    align-items: center;
  }
  .dh-pill {
    padding: 4px 10px; border-radius: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .dh-pill-mono {
    padding: 4px 10px; border-radius: 12px;
    background: rgba(26,26,29,0.04); color: rgba(26,26,29,0.7);
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
  }
  .dashboard-error {
    background: rgba(198,40,40,0.06); border-left: 3px solid #c62828;
    padding: 16px 20px; border-radius: 8px; margin: 16px 0;
    font-size: 14px; line-height: 1.6;
  }
  .dashboard-error code {
    background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 3px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  .dashboard-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;
  }
  @media (max-width: 1100px) {
    .dashboard-row { grid-template-columns: 1fr; }
  }
  .dashboard-card {
    background: white; border: 1px solid rgba(0,0,0,0.06); border-radius: 8px;
    padding: 18px 20px; min-width: 0;
  }
  .dashboard-card-head {
    display: flex; align-items: center; gap: 4px;
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase;
    color: rgba(26,26,29,0.7);
  }
  .dashboard-empty {
    color: rgba(0,0,0,0.4); font-size: 13px; padding: 20px 0;
  }
  .dashboard-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .dashboard-table th {
    text-align: left; padding: 8px 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px;
    color: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .dashboard-table td {
    padding: 8px 6px; border-bottom: 1px solid rgba(0,0,0,0.04);
    vertical-align: top;
  }
  .dashboard-table .dt-query {
    max-width: 240px; word-break: break-word;
  }
  .dashboard-table .dt-query a {
    color: #1565c0; text-decoration: none;
  }
  .dashboard-table .dt-query a:hover { text-decoration: underline; }
  .dashboard-table .dt-num {
    text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="admin-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>

</html>
