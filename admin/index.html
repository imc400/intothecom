<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin · Intothecom</title>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#0a0a0b"/>

<link rel="icon" type="image/png" href="/assets/mark-dark.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f4efe6;
    color: #1a1a1d;
    font-family: 'Sora', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .admin-shell {
    display: flex;
    min-height: 100vh;
  }
  .admin-sidebar {
    width: 280px;
    background: #0a0a0b;
    color: #f4efe6;
    padding: 32px 24px;
    border-right: 1px solid #1a1a1d;
    overflow-y: auto;
  }
  .admin-main {
    flex: 1;
    padding: 32px 40px;
    overflow-y: auto;
    max-height: 100vh;
  }
  .admin-brand {
    font-family: 'Sora', sans-serif;
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .admin-brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: #f39200;
    margin-bottom: 32px;
    text-transform: uppercase;
  }
  .admin-user {
    border-top: 1px solid #1a1a1d;
    padding-top: 24px;
    margin-top: auto;
    font-size: 12px;
    color: rgba(244,239,230,0.7);
  }
  .admin-user-email {
    color: #f4efe6;
    margin-bottom: 8px;
    word-break: break-all;
  }
  .admin-nav { display: flex; flex-direction: column; gap: 4px; }
  .admin-nav-item {
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: rgba(244,239,230,0.7);
    background: transparent;
    border: none;
    text-align: left;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.15s;
  }
  .admin-nav-item:hover { background: rgba(244,239,230,0.05); color: #f4efe6; }
  .admin-nav-item.active { background: rgba(243,146,0,0.15); color: #f39200; }
  .btn {
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .btn-primary { background: #f39200; color: #0a0a0b; }
  .btn-primary:hover { background: #ff9d0a; }
  .btn-primary:disabled { background: #cccccc; color: #888; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: #f4efe6;
    border: 1px solid rgba(244,239,230,0.2);
  }
  .btn-ghost:hover { border-color: rgba(244,239,230,0.5); }
  .btn-danger { background: #d32f2f; color: white; }
  .btn-danger:hover { background: #e53935; }
  .login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 40px;
  }
  .login-card {
    background: white;
    padding: 48px 40px;
    border-radius: 12px;
    box-shadow: 0 10px 60px rgba(0,0,0,0.08);
    max-width: 420px;
    width: 100%;
  }
  .login-title {
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .login-subtitle {
    color: rgba(26,26,29,0.6);
    margin-bottom: 32px;
    font-size: 14px;
  }
  .btn-google {
    width: 100%;
    background: white;
    color: #1a1a1d;
    border: 1px solid rgba(26,26,29,0.15);
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .btn-google:hover { border-color: rgba(26,26,29,0.4); background: #fafafa; }
  .article-list { display: flex; flex-direction: column; gap: 12px; }
  .article-item {
    background: white;
    border: 1px solid rgba(26,26,29,0.08);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .article-item:hover { border-color: rgba(26,26,29,0.2); transform: translateY(-1px); }
  .article-item-title { font-size: 16px; font-weight: 500; }
  .article-item-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(26,26,29,0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }
  .h1 { font-size: 32px; font-weight: 500; }
  .h2-section { font-size: 18px; font-weight: 500; margin: 32px 0 16px 0; }
  .form-field { margin-bottom: 16px; }
  .form-field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(26,26,29,0.6);
    margin-bottom: 6px;
  }
  .form-field input, .form-field textarea, .form-field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid rgba(26,26,29,0.15);
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    background: white;
    color: #1a1a1d;
  }
  .form-field input:focus, .form-field textarea:focus, .form-field select:focus {
    outline: none;
    border-color: #f39200;
  }
  .form-field textarea { min-height: 80px; font-family: 'Sora', sans-serif; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .section-block {
    background: white;
    border: 1px solid rgba(26,26,29,0.1);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .section-block-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(26,26,29,0.6);
  }
  .add-section {
    background: #ededea;
    border: 2px dashed rgba(26,26,29,0.15);
    color: #1a1a1d;
    padding: 16px;
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    border-radius: 8px;
    color: white;
    font-size: 13px;
    z-index: 99999;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    max-width: 400px;
  }
  .toast.success { background: #2e7d32; }
  .toast.error { background: #c62828; }
  .toast.info { background: #1565c0; }
  .empty-state { text-align: center; padding: 60px 20px; color: rgba(26,26,29,0.5); }
  .row-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .row-buttons button {
    background: rgba(26,26,29,0.05);
    color: #1a1a1d;
    padding: 4px 10px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
  }
  .row-buttons button:hover { border-color: rgba(26,26,29,0.15); }
  .row-buttons button.danger { color: #c62828; }
  .pre-publish-check {
    background: rgba(243,146,0,0.08);
    border-left: 3px solid #f39200;
    padding: 12px 16px;
    margin: 16px 0;
    font-size: 13px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="admin-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script defer src="/dist/admin.js?v=21870978"></script>
</body>
</html>
