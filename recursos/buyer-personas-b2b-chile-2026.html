      "acceptedAnswer": {
        "@type": "Answer",
        "text": "El ICP describe la cuenta ideal a nivel firmográfico (industria, tamaño, facturación, geografía). El buyer persona describe al individuo dentro de esa cuenta (rol, KPIs, miedos, criterios de decisión, comportamiento de búsqueda). Necesitás ambos: ICP para saber qué empresas perseguir, persona para saber cómo hablarles a las personas dentro."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cuántas entrevistas hay que hacer para construir una buyer persona B2B?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "El mínimo recomendado por HubSpot y por el Buyer Persona Institute es 5 entrevistas por rol, idealmente 10. Mezclá clientes ganados recientes, prospectos perdidos y clientes churneados. Si después de 7-10 entrevistas no aparecen patrones repetidos, probablemente tu producto vende a perfiles muy distintos y necesitás más de una persona."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cuántas buyer personas debe tener una empresa B2B en Chile?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Entre 1 y 3 personas primarias por línea de producto. Si necesitás más de 5, probablemente tenés un problema de posicionamiento o de portafolio, no de segmentación. Más personas se vuelven inmanejables operativamente: ningún equipo de marketing en pyme chilena puede sostener 8 mensajes diferenciados al mismo tiempo."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cada cuánto se actualizan las buyer personas?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Al menos una vez por año, y siempre tras cambios fuertes de mercado, producto o pricing. En Chile 2026 la adopción masiva de IA generativa en pyme cambió comportamientos de compra: ciclos más cortos y miedos nuevos relacionados con automatización. Personas hechas en 2022 sin actualizar están obsoletas."
      }

    <p>Un buyer persona B2B es la representación del individuo dentro de una cuenta objetivo (rol, miedos, motivaciones, criterios de compra). Es distinto del ICP, que define qué cuentas perseguir a nivel firmográfico. Las tres fuentes válidas de investigación son: entrevistas a clientes actuales ganados y perdidos, data de CRM sobre deals cerrados, y conversaciones con el equipo de ventas. En Chile 2026 importa porque los comités de compra promedian 6-13 personas y cada una llega con 4-5 piezas de research propio.
