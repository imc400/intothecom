      "@type": "Question",
      "name": "¿Cuánto tiempo demora ver resultados en marketing digital B2B en LATAM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Paid Media: 2-3 semanas para baseline accionable. Email Marketing: primer flow operativo en 30 días. SEO + GEO: 3-6 meses para impacto visible, con sandbox period en las primeras 6-8 semanas. Cualquier proveedor que prometa SEO en 30 días miente o usa tácticas que penalizan."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cuál es el presupuesto mínimo realista para marketing B2B digital en LATAM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Para una empresa mediana B2B con ventas USD 1M-10M anuales: USD 8,000-20,000 mensuales totales. Distribución típica: 40% paid media, 25% contenido (incluyendo SEO/GEO), 20% tools y operaciones, 15% creativos y producción. Por debajo de USD 5K/mes el ROI suele ser inestable."
      }
    },
    {
      "@type": "Question",
      "name": "¿Necesito una agencia o puedo armar un equipo in-house?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ambos caminos son válidos. Equipo in-house tiene sentido cuando vendes >USD 5M anuales y tu producto requiere expertise de dominio profundo. Agencia tiene sentido cuando necesitas velocidad inicial, mix de habilidades raras (paid + SEO + GEO + dev) o tu ciclo de venta no justifica head-count completo. Lo que NO funciona: freelancer suelto sin estrategia integrada."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cómo se mide el éxito en marketing B2B vs B2C?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "B2C optimiza CAC y AOV con ciclos cortos. B2B optimiza Pipeline Generation, Sales Qualified Leads (SQL), Marketing Qualified Leads (MQL), CAC payback (objetivo <12 meses), y crecientemente Citation Rate en LLMs como leading indicator de discovery. La métrica vanity más común a evitar: MQLs sin filtro de fit (calidad > volumen)."
      }
    },
    {
      "@type": "Question",
      "name": "¿Las penalizaciones de Google afectan también a las respuestas de ChatGPT?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Parcialmente. ChatGPT Search usa Bing como sustrato (87% overlap entre citaciones SearchGPT y top orgánico de Bing según Seer Interactive). Una penalización Google no afecta Bing inmediatamente, pero las prácticas que penaliza Google (contenido thin, AI puro sin edición, parasite SEO, schema invisible) también afectan a Bing y por carambola a ChatGPT. Las prácticas que sí son específicas de GEO: brand mentions, Wikidata Q-ID, fuentes externas citadas."
      }
    }
