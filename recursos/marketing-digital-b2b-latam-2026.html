      "@type": "Question",
      "name": "¿Necesito una agencia o puedo armar un equipo in-house?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ambos caminos son válidos. Equipo in-house tiene sentido cuando vendes >USD 5M anuales y tu producto requiere expertise de dominio profundo. Agencia tiene sentido cuando necesitas velocidad inicial, mix de habilidades raras (paid + SEO + GEO + dev) o tu ciclo de venta no justifica head-count completo. Lo que NO funciona: freelancer suelto sin estrategia integrada."
      }

      "@type": "Question",

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "B2C optimiza CAC y AOV con ciclos cortos. B2B optimiza Pipeline Generation, Sales Qualified Leads (SQL), Marketing Qualified Leads (MQL), CAC payback (objetivo <12 meses), y crecientemente Citation Rate en LLMs como leading indicator de discovery. La métrica vanity más común a evitar: MQLs sin filtro de fit (calidad > volumen)."
