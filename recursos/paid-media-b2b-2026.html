      "@type": "Question",
      "name": "¿Cuánto presupuesto mínimo se necesita para empezar paid B2B en LATAM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Para que el algoritmo tenga señal suficiente y puedas testear hipótesis: USD 2.500-3.500 mensuales mínimo, repartidos en 1-2 canales primero (no abrir 5 plataformas con USD 500 cada una). Bajo USD 2.500/mes, mejor invertir esos recursos en SEO orgánico + outbound manual."
      }
    },
    {
      "@type": "Question",
      "name": "¿LinkedIn Ads o Google Ads para B2B chileno?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Google Ads primero, casi siempre. Captura demand existente (gente buscando \"agencia X Chile\"). LinkedIn Ads para crear demand cuando ya tienes baseline funcionando — más caro, ciclos más largos. La excepción: si vendes a roles específicos sin volumen de búsqueda significativo (ej. CFOs de empresas 200-1000 empleados), LinkedIn puede ser primario."
      }
    },
    {
      "@type": "Question",
      "name": "¿Conversions API es realmente necesario en 2026?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sí. Sin CAPI pierdes 25-40% de conversion signal en iOS post-iOS18, y el algoritmo optimiza peor en consecuencia. Setup inicial requiere dev (3-5 días) pero el lift en ROAS suele justificar el costo en 60-90 días. Es uno de los proyectos con mejor ROI en paid B2B 2026."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cómo medir el ROI real del paid si los deals cierran en 90+ días?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tres palancas combinadas: (1) Setup de Enhanced Conversions for Leads con valor monetario por etapa del pipeline (no esperar a deal cerrado, valorar SQL en USD basado en win rate histórico × deal size promedio); (2) Atribución position-based o data-driven (no last-click); (3) Lookback windows extendidas (90-180 días en LinkedIn, 90 días en Google, 28-56 días en Meta). Cohort analysis mensual para validar."
      }
    },
    {
      "@type": "Question",
      "name": "¿Performance Max sirve para B2B o es solo para e-commerce?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sirve pero con caveats. Funciona cuando: (1) tienes ≥30 conversiones del mismo tipo por mes; (2) la conversión es de valor real (SQL, no MQL); (3) tienes value-based bidding configurado con USD reales; (4) hay assets variados (videos, imágenes, copys) para que el sistema componga. Si te falta cualquiera, PMax aprende mal y desperdicia budget. Para early-stage B2B, Search non-brand + Demand Gen suele ser mejor."
      }
    },
    {
      "@type": "Question",
      "name": "¿TikTok Ads funciona para empresas B2B chilenas?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Depende del producto. Funciona bien para SaaS, productivity tools, agencias creativas, edtech, fintech consumer. NO funciona (todavía) para industrial, manufactura, B2B muy específico vertical (logística, mining tools). Si tu founder o equipo ya está creando contenido orgánico en TikTok con tracción decente, Spark Ads (boost orgánico) es 3-5× más eficiente que ads cold tradicional."
      }
    }
