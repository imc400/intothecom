  "@context": "https://schema.org",

  "mainEntity": [
    {
      "@type": "Question",
      "name": "¿En cuánto tiempo se entrega un proyecto Next.js + Shopify?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "MVP (50-500 SKUs, 1 mercado): 6-10 semanas. Mid-market (500-5K SKUs, 2-3 mercados, CMS, search avanzado): 10-16 semanas. Enterprise (5K+ SKUs, 4+ mercados, B2B + DTC, ERP): 4-8 meses. Cualquier proveedor que prometa \"headless en 3 semanas\" está armando un wrapper básico sin SEO técnico, migración real ni QA — quiebra al mes 2 en producción."
      }
    },
    {
      "@type": "Question",
      "name": "¿Headless vs theme tradicional Shopify, cuál elegir?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tema tradicional sirve si: GMV <USD 500K/año, 1 mercado, equipo sin dev, requirements estándar. Headless si: GMV >USD 500K/año, necesitas performance excepcional (CWV verdes), múltiples mercados, integraciones custom ERP/CRM, o el contenido editorial pesa tanto como el catálogo. En LATAM 2026 el umbral económico está en USD 500K-1M ARR para que el TCO compense."
      }
    },
    {
      "@type": "Question",
      "name": "¿Shopify Plus es necesario para headless?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Headless funciona desde Shopify Basic (USD 39/mes, CLP 36K). Plus se justifica cuando necesitas: wholesale B2B nativo, checkout extensibility avanzada, Launchpad, B2B con catálogos privados, >5K órdenes/día, o multi-store unificada. Para DTC mid-market LATAM con GMV USD 1-3M/año, **Shopify Advanced (USD 399, CLP 368K) + Next.js headless** es suficiente y ahorra USD 23K/año vs Plus."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cómo medimos Core Web Vitals en headless?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tres capas: (1) **field data (real users)** via Vercel Speed Insights + Search Console CWV report — números que Google usa para ranking; (2) **lab data automatizado** con Lighthouse CI en cada PR; (3) **synthetic monitoring** con PageSpeed Insights API en URLs clave diario. Targets mayo 2026: LCP ≤2.5s, INP ≤200ms, CLS ≤0.1 en mobile 4G p75. Si <75% usuarios aprueban los tres, Google penaliza ranking."
      }
    },
    {
      "@type": "Question",
      "name": "¿Qué pasa si Shopify hace breaking changes en Storefront API?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Shopify mantiene versiones API estables por **12 meses** (deprecation policy oficial). Cada release es opt-in. Equipo dev migra entre versiones cada 6-9 meses con sprint dedicado (~20-40 hrs). Mitigación: schema validation en CI, eval suite de queries críticas, suscripción al developer changelog. Lo que NUNCA hace Shopify: cambiar API sin previo aviso o forzar migración <12 meses."
      }
    },
    {
      "@type": "Question",
      "name": "¿Vale la pena Shopify Hydrogen en vez de Next.js?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Hydrogen tiene sentido si: equipo Shopify-centric, usas Shopify Plus (Oxygen incluido), no migrarás plataforma, valoras hooks pre-armados sobre flexibilidad. Next.js tiene sentido si: quieres pool dev grande (3-4× más React+Next que Hydrogen), futuro-proofing por si migras, integraciones con ecosystem React (Sanity, Algolia, Auth0), o ya tienes Vercel. Para 70% de e-commerce LATAM mid-market evaluados, **Next.js gana** por flexibilidad y ecosystem."
      }
    }
