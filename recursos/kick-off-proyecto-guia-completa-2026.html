{
  "@context": "https://schema.org",

  "mainEntity": [
    {
      "@type": "Question",
      "name": "¿Qué es un kick off meeting?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Un kick off meeting es la primera reunión formal entre cliente y proveedor de un proyecto, donde se confirma alcance, objetivos medibles, roles con nombre propio, calendario y criterios de éxito antes de iniciar la ejecución. Termina con un acta firmada y enviada en menos de 24 horas. Su función es transformar un acuerdo comercial en un proyecto operativo con dueños claros de cada actividad."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cuánto debe durar un kick off?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Entre 60 y 120 minutos según complejidad. Un proyecto B2B de complejidad media con ticket entre USD 5.000 y USD 20.000 se resuelve en 90 a 100 minutos efectivos siguiendo una agenda enviada con 48 horas de anticipación. Más de 2 horas indica que falta preparación previa; menos de 60 minutos indica que se están saltando bloques críticos como matriz RACI o scope OUT explícito."
      }
    },
    {
      "@type": "Question",
      "name": "¿Quién debe asistir al kick off por parte del cliente y de la agencia?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Del lado cliente: sponsor económico con autoridad presupuestaria, project manager o líder operativo del proyecto, y representantes de las áreas impactadas (marketing, IT, legal según corresponda). Del lado agencia: account lead, project manager asignado y al menos un senior del equipo técnico que va a entregar. Total recomendado entre 5 y 10 personas. Más de 12 indica teatro corporativo, menos de 4 indica que falta alguien clave."
      }
    },
    {
      "@type": "Question",
      "name": "¿Qué diferencia hay entre un kick off interno y uno con cliente?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "El kick off interno se hace antes del kick off con cliente, idealmente 3 a 5 días antes, y reúne solo al equipo del proveedor. Su objetivo es revisar el contrato, anticipar riesgos, asignar roles internos y preparar las preguntas que se le van a hacer al cliente. El kick off con cliente es la reunión externa formal donde se valida todo eso y se firma el acuerdo operativo. Saltarse el interno es la causa número uno de kick offs con cliente confusos o mal preparados."
      }
    },
    {
      "@type": "Question",
      "name": "¿Qué pasa si el cliente no quiere hacer kick off?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Es una bandera roja temprana sobre el nivel de compromiso del sponsor. Antes de aceptar saltarlo, conviene explicar en términos económicos qué cuesta no hacerlo: en promedio 22% de sobrecosto en horas y un retraso medio de 3 semanas en proyectos B2B sobre USD 10.000 según data interna IntoTheCom. Si el cliente igual insiste en no hacerlo, una alternativa mínima viable es un kick off asincrónico documentado: un Notion o Google Doc con los 9 bloques del acta que ambas partes completan y firman digitalmente. Nunca cero kick off en proyectos sobre USD 5.000."
      }
    }
  ]
