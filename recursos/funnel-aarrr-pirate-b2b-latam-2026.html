        "text": "Sirve en B2B, pero con definiciones reescritas. Activation deja de ser signup y pasa a ser Product Qualified Lead. Retention se mide a 30/60/90 días y por NRR, no por DAU. Referral se mide por programa formal y NPS, no por viral coefficient. El marco sigue siendo útil como mapa para diagnosticar dónde está el cuello de botella."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cuál es la métrica más importante en un funnel AARRR B2B 2026?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Depende de la etapa donde estás perdiendo. Si tu CAC payback supera 24 meses, mira Acquisition y Activation. Si tu NRR está bajo 100%, mira Retention. La métrica única que más usamos para decidir es CAC Payback Period: combina coste de adquisición con velocidad de retorno. Benchmark 2026: elite bajo 12 meses, sano 15-18, alarma sobre 24."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cuánto cuesta implementar el stack de medición AARRR en LATAM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Para una empresa B2B mediana en Chile, Colombia, Perú, USA o España, el stack de software (CRM, product analytics, revenue analytics, customer success) cuesta entre USD 400 y USD 1.500 mensuales, depende del tamaño del equipo y de la complejidad del producto. Excluye media spend (paid media) y desarrollo de integraciones, que se calcula aparte."
      }
    },
    {
      "@type": "Question",
      "name": "¿Qué diferencia AARRR de un funnel tradicional MQL-SQL-Won?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "El funnel MQL-SQL-Won es vista de ventas: optimiza desde el primer contacto hasta el cierre. AARRR es vista de ciclo de vida completo: incluye lo que pasa después del cierre (Retention, Revenue expansion, Referral). Para B2B con renovaciones anuales y expansion, AARRR captura mejor el LTV real. En la práctica los buenos equipos B2B 2026 corren ambos en paralelo: MQL-SQL-Won para sales ops, AARRR para growth ops."
